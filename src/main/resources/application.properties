spring.application.name=ServiceDiscoveryApplication

server.port=${SERVER_PORT:8761}

# Local overrides: an optional .env in the working directory (see .env.example) feeds the ${...} placeholder
# above, so `./mvnw spring-boot:run` and `make run` read the same file. Real environment variables win over it.
# Values must be unquoted: the file is read as .properties here, but sourced by the shell in the Makefile.
spring.config.import=optional:file:.env[.properties]

eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false
